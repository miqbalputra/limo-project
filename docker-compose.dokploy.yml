services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LIMO_DEMO_MODE: ${LIMO_DEMO_MODE:-false}
      APP_URL: ${APP_URL}
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-limo_session}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-10080}
      PRIVATE_STORAGE_PATH: /app/storage/private
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_WEBHOOK_SECRET: ${BACKUP_WEBHOOK_SECRET:-}
      MAX_REGISTRATION_FILE_MB: ${MAX_REGISTRATION_FILE_MB:-10}
      MAX_MATERIAL_FILE_MB: ${MAX_MATERIAL_FILE_MB:-25}
      MAX_RPP_FILE_MB: ${MAX_RPP_FILE_MB:-20}
      MAYAR_ENV: ${MAYAR_ENV:-production}
      MAYAR_BASE_URL: ${MAYAR_BASE_URL:-}
      MAYAR_API_KEY: ${MAYAR_API_KEY:-}
      MAYAR_MERCHANT_ID: ${MAYAR_MERCHANT_ID:-}
      MAYAR_WEBHOOK_SECRET: ${MAYAR_WEBHOOK_SECRET:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-n8n}
      STUDENT_PORTAL_ENABLED: ${STUDENT_PORTAL_ENABLED:-false}
      LEARNING_MODULES_ENABLED: ${LEARNING_MODULES_ENABLED:-false}
      ASSIGNMENTS_ENABLED: ${ASSIGNMENTS_ENABLED:-false}
      GRADEBOOK_ENABLED: ${GRADEBOOK_ENABLED:-false}
      CALENDAR_ENABLED: ${CALENDAR_ENABLED:-false}
      ACTIVITY_COMPLETION_ENABLED: ${ACTIVITY_COMPLETION_ENABLED:-false}
      REMEDIAL_ENABLED: ${REMEDIAL_ENABLED:-false}
      CLASS_DISCUSSION_ENABLED: ${CLASS_DISCUSSION_ENABLED:-false}
      PERIODIC_REPORTS_ENABLED: ${PERIODIC_REPORTS_ENABLED:-false}
      GUARDIAN_ASSISTED_SUBMISSION_ENABLED: ${GUARDIAN_ASSISTED_SUBMISSION_ENABLED:-false}
      N8N_EMAIL_WEBHOOK_URL: ${N8N_EMAIL_WEBHOOK_URL:-}
      N8N_WHATSAPP_WEBHOOK_URL: ${N8N_WHATSAPP_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_LIMO_CONTACT_EMAIL: ${NEXT_PUBLIC_LIMO_CONTACT_EMAIL:-admin@limo.local}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DOKPLOY_SEED_ON_START: ${DOKPLOY_SEED_ON_START:-false}
      LIMO_ALLOW_DEMO_SEED: ${LIMO_ALLOW_DEMO_SEED:-false}
    ports:
      - "3000:3000"
    volumes:
      - limo-private-storage:/app/storage/private
      - limo-backups:/app/backups

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - limo-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  limo-mariadb-data:
  limo-private-storage:
  limo-backups:
