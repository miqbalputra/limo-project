name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: file:./dev.db
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      SESSION_COOKIE_NAME: limo_session_ci
      PRIVATE_STORAGE_PATH: ./.ci/private-storage
      BACKUP_DIR: ./.ci/backups
      BACKUP_WEBHOOK_SECRET: ci-only-backup-webhook-secret
      MAYAR_ENV: sandbox
      MAYAR_BASE_URL: http://127.0.0.1:9
      MAYAR_API_KEY: ci-placeholder-mayar-api-key
      MAYAR_MERCHANT_ID: ci-placeholder-mayar-merchant
      MAYAR_WEBHOOK_SECRET: ci-placeholder-mayar-webhook-secret
      NOTIFICATION_PROVIDER: whatsapp
      LIMO_ALLOW_DEMO_SEED: "true"
      DOKPLOY_SQLITE_DEMO: "true"
      STUDENT_PORTAL_ENABLED: "true"
      LEARNING_MODULES_ENABLED: "true"
      ASSIGNMENTS_ENABLED: "true"
      GRADEBOOK_ENABLED: "true"
      CALENDAR_ENABLED: "true"
      ACTIVITY_COMPLETION_ENABLED: "true"
      REMEDIAL_ENABLED: "true"
      PERIODIC_REPORTS_ENABLED: "true"
      GUARDIAN_ASSISTED_SUBMISSION_ENABLED: "false"
      STUDENT_SELF_EXAM_ENABLED: "true"
      CLASS_DISCUSSION_ENABLED: "true"
      NEXT_PUBLIC_LIMO_CONTACT_EMAIL: ci@limo.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare disposable SQLite data
        run: npm run sqlite:setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Route guard audit
        run: npm run test:guards

      - name: Verify color tokens
        run: npm run check:colors

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Integration suite (SQLite, against production build)
        run: node scripts/run-integration-suite.mjs
        env:
          NODE_ENV: test

      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run normal end-to-end tests
        run: npm run test:e2e

      - name: Debug e2e webServer startup (sementara, hapus setelah CI hijau)
        if: ${{ failure() }}
        run: |
          DB="file:./e2e-debugci.db"
          export DATABASE_URL="$DB" LIMO_SQLITE_DATABASE_URL="$DB"
          npm run --silent sqlite:setup > /dev/null 2>&1 || true
          timeout 90 npx playwright test tests/e2e/a8-g12.spec.ts --reporter=line > /tmp/pw-debug.log 2>&1 || true
          echo "::error::PWDEBUG_B ls $(ls -la prisma/*.db 2>/dev/null | head -3 | tr '\n' '|')"
          tail -c 2500 /tmp/pw-debug.log | while IFS= read -r line; do echo "::error::PWDEBUG $line"; done

      - name: Run production PWA end-to-end tests
        run: npm run test:e2e:pwa

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            playwright-report-pwa
            test-results
          if-no-files-found: ignore
