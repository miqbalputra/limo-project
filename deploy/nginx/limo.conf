# =============================================================================
# LIMO — Konfigurasi Nginx produksi (reverse proxy untuk Next.js via PM2)
# =============================================================================
# Pasang:
#   sudo cp deploy/nginx/limo.conf /etc/nginx/sites-available/limo.conf
#   sudo ln -s /etc/nginx/sites-available/limo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sebelum aktif: ganti limo.example.com dengan domain asli, dan jalankan
# certbot untuk TLS (sudo certbot --nginx -d limo.example.com) — blok HTTPS
# di bawah sudah disiapkan untuk dikelola certbot.
#
# Catatan keamanan:
# - Rate limit (zone + limit_req) adalah lapisan kedua; set
#   RATE_LIMIT_TRUST_PROXY=true di env aplikasi agar X-Forwarded-For
#   dari Nginx (hop terpercaya) dipakai oleh throttle LIMO.
# - Header keamanan aplikasi (X-Frame-Options, Permissions-Policy, dst.)
#   sudah di-set oleh next.config.ts — TIDAK diduplikasi di sini.
# =============================================================================

# Zone rate limit global: 20 request/detik per IP, burst 40.
# Untuk endpoint sensitif (login/webhook) Nginx cukup sebagai lapisan pertama;
# verifikasi rinci tetap di aplikasi.
limit_req_zone $binary_remote_addr zone=limo_general:10m rate=20r/s;
# Zone lebih ketat untuk path auth & pembayaran.
limit_req_zone $binary_remote_addr zone=limo_auth:10m rate=5r/s;

upstream limo_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name limo.example.com;

    # ACME challenge untuk certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS utama ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name limo.example.com;

    # Certbot akan mengisi/memperbarui blok sertifikat ini otomatis.
    ssl_certificate     /etc/letsencrypt/live/limo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limo.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (aman karena seluruh trafik dipaksa HTTPS di atas).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload terbesar di aplikasi: file kuis 25 MB — beri ruang ekstra.
    client_max_body_size 64m;

    # Webhook payment: butuh body utuh + tanpa buffering berlebih.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Connection        "";
    proxy_read_timeout 60s;

    # Webhook Mayar — rate limit longgar (provider, bukan user), body JSON kecil.
    location = /api/v1/webhooks/mayar {
        limit_req zone=limo_auth burst=20 nodelay;
        proxy_pass http://limo_app;
    }

    # Auth (login/reset) — rate limit ketat lapisan pertama.
    location /api/v1/auth/ {
        limit_req zone=limo_auth burst=10 nodelay;
        proxy_pass http://limo_app;
    }

    # Aplikasi + API lain.
    location / {
        limit_req zone=limo_general burst=40 nodelay;
        proxy_pass http://limo_app;
    }

    # Static Next.js (bila melayani _next/static dari disk) — cache agresif.
    location /_next/static/ {
        proxy_pass http://limo_app;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sembunyikan server token.
    server_tokens off;
}
